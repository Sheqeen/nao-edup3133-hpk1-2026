      if (sim === 'topik1') {
        counts(items, 'topic', {TOPIK_1:30}, `${name}.topic`);
        counts(items, 'area', AREAS1, `${name}.area`);
      }
      if (sim === 'topik2') counts(items,'model',MODELS2,`${name}.model`);
      if (sim === 'final') {
        counts(items,'topic',{TOPIK_1:12,TOPIK_2:18},`${name}.topic`);
        counts(items.filter(q=>q.topic==='TOPIK_1'),'area',FINAL1,`${name}.TOPIK_1.area`);
        counts(items.filter(q=>q.topic==='TOPIK_2'),'area',FINAL2,`${name}.TOPIK_2.area`);

        'resultConfig.globalRules.resultSections',['KEPUTUSAN','PENGUASAAN','FOKUS ULANG KAJI'],rules.resultSections);
      const thresholds = rules.masteryThresholds;
      check(Array.isArray(thresholds) && thresholds.length > 0, 'resultConfig.masteryThresholds','array',thresholds);

          check(typeof r.label==='string' && r.label.length>0 && typeof r.status==='string',

          check(found.length===1,`resultConfig.masteryThresholds(${s}/${n})`,1,found.length);
        }

      check(weight.correct>0 && weight.incorrect===0 && weight.unanswered===0,
        'resultConfig.scoreTreatment','betul positif; salah/kosong sifar',weight);
      const weak=rules.weakAreaSelection;
      check(Number.isInteger(weak?.maxAreas) && weak.maxAreas>=1 && weak.maxAreas<=3,
        'resultConfig.weakAreaSelection.maxAreas','1–3',weak?.maxAreas);

        if (!c) continue;
        check(c.totalItems===items.length && c.totalItems===30,`${sim}.config.totalItems`,30,c.totalItems);
        check(c.durationMinutes===30,`${sim}.config.durationMinutes`,30,c.durationMinutes);
        const view=c.masteryView || {}, groups=view.groups || view.primaryGroups, field=view.groupBy || view.primaryGroupBy;
        check(Array.isArray(groups),`${sim}.masteryView.groups`,'array',groups);
        if (!Array.isArray(groups)) continue;
        check(new Set(groups.map(g=>g.key)).size===groups.length,`${sim}.groups.key`,'unik',groups.map(g=>g.key));
        groups.forEach(g => {
          check(typeof g.label==='string',`${sim}.groups.${g.key}.label`,'rentetan',g.label);
          check(items.filter(q=>q[field]===g.key).length===g.itemCount,
            `${sim}.groups.${g.key}.itemCount`,g.itemCount,items.filter(q=>q[field]===g.key).length);
        });
        items.forEach(q=>check(groups.filter(g=>q[field]===g.key).length===1,
          `${sim}.${q.id}.primaryGroup`,'satu kumpulan',q[field]));
        if (sim==='final') {
          const secondary=view.secondaryDiagnosis;
          check(secondary?.enabled===true, 'final.secondaryDiagnosis.enabled', true, secondary?.enabled);
          check(Number.isInteger(secondary?.maxAreas) && secondary.maxAreas>=1 && secondary.maxAreas<=3,
            'final.secondaryDiagnosis.maxAreas','1–3',secondary?.maxAreas);
          const groups2=Object.entries(secondary?.grouping || {}).flatMap(([topic,gs])=>gs.map(g=>({...g,topic})));
          items.forEach(q=>check(groups2.filter(g=>g.topic===q.topic &&
            Object.entries(g.match).every(([k,v])=>q[k]===v)).length===1,
            `final.${q.id}.secondaryGroup`,1,groups2.filter(g=>g.topic===q.topic &&
              Object.entries(g.match).every(([k,v])=>q[k]===v)).length));
          groups2.forEach(g=>check(typeof c.revisionMessages?.[g.key]==='string' &&
            c.revisionMessages[g.key].length>0,`final.revisionMessages.${g.key}`,'mesej sumber',c.revisionMessages?.[g.key]));
        } else groups.forEach(g=>check(typeof c.revisionMessages?.[g.key]?.message==='string' &&
          typeof c.revisionMessages?.[g.key]?.title==='string',
          `${sim}.revisionMessages.${g.key}`,'title + message',c.revisionMessages?.[g.key]));
        check(Array.isArray(c.buttons) && c.buttons.length>0,`${sim}.buttons`,'array',c.buttons);
      }
      for (const key of ['score','percentage','timeUsed','mastery','revisionFocus'])
        check(typeof cfg.uiCopy.labels?.[key]==='string',`resultConfig.uiCopy.labels.${key}`,'teks',cfg.uiCopy.labels?.[key]);
      check(typeof cfg.uiCopy.footerNote==='string','resultConfig.uiCopy.footerNote','teks',cfg.uiCopy.footerNote);

<script>
/* One exam engine for all three banks. Selection is ALWAYS by original option.id. */
(function(L) {
  'use strict';
  const random = () => {
    if (globalThis.crypto?.getRandomValues) {
      return globalThis.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
    }
    return Math.random();
  };
  const shuffled = (list, rng=random) => {
    const out=[...list];
    for (let i=out.length-1;i>0;i--) {
      const j=Math.floor(rng()*(i+1));
      [out[i],out[j]]=[out[j],out[i]];
    }
    return out;
  };
  const durationMs = attempt => L.config(attempt.simulation).durationMinutes*60000;
  const deadline = attempt => attempt.startedAt+durationMs(attempt);
  const remainingMs = (attempt, now=L.clock()) => Math.max(0,Math.min(durationMs(attempt),deadline(attempt)-now));
  const isOpen = (attempt, now=L.clock()) => attempt?.status==='active' && remainingMs(attempt,now)>0;
  function start(simulation, now=L.clock(), rng=random, previousOrder=[]) {
    if (!L.keys.includes(simulation)) throw Error('Simulasi tidak sah.');
    const items=L.bank(simulation).items;
    let questionOrder=shuffled(items.map(q=>q.id),rng);
    // Never repeat the immediately previous order, even with a deterministic test RNG.
    if (JSON.stringify(questionOrder)===JSON.stringify(previousOrder)) {
      questionOrder=[...questionOrder.slice(1),questionOrder[0]];
    }
    const optionOrder=Object.fromEntries(items.map(q=>[q.id,shuffled(q.options.map(o=>o.id),rng)]));
    return {
      version:1, simulation, status:'active', startedAt:now, submittedAt:null,
      reason:null, currentIndex:0, questionOrder, optionOrder, answers:{}, flags:[], warningsShown:[]
    };
  }
  function setAnswer(attempt, questionId, optionId, now=L.clock()) {
    if (!isOpen(attempt,now)) return attempt;
    const item=L.bank(attempt.simulation).items.find(q=>q.id===questionId);
    if (!item || !item.options.some(o=>o.id===optionId)) return attempt;
    return {...attempt, answers:{...attempt.answers,[questionId]:optionId}};
  }
  function move(attempt,index,now=L.clock()) {
    if (!isOpen(attempt,now) || !Number.isInteger(index) || index<0 || index>=attempt.questionOrder.length) return attempt;
    return {...attempt,currentIndex:index};
  }
  function toggleFlag(attempt,questionId,now=L.clock()) {
    if (!isOpen(attempt,now) || !attempt.questionOrder.includes(questionId)) return attempt;
    const has=attempt.flags.includes(questionId);
    return {...attempt,flags:has?attempt.flags.filter(x=>x!==questionId):[...attempt.flags,questionId]};
  }
  function submit(attempt,now=L.clock(),reason='manual') {
    if (!attempt || attempt.status!=='active') return attempt;
    const expired=now>=deadline(attempt);
    return L.deepFreeze({...attempt,status:'submitted',
      submittedAt:Math.max(attempt.startedAt,Math.min(now,deadline(attempt))),
      reason:expired?'timeout':reason});
  }
  function checkAttempt(a,simulation,expectedStatus) {
    const errors=[], bad=(condition,path)=>{ if(!condition)errors.push(path); };
    if (!a || typeof a!=='object') return ['attempt'];
    bad(L.keys.includes(simulation) && a.simulation===simulation,'simulation');
    if (!L.keys.includes(simulation)) return errors;
    const items=L.bank(simulation).items, ids=items.map(q=>q.id);
    bad(a.status===expectedStatus,'status');
    bad(a.version===1,'version');
    bad(Number.isFinite(a.startedAt) && a.startedAt>0,'startedAt');
    bad(Number.isInteger(a.currentIndex)&&a.currentIndex>=0&&a.currentIndex<30,'currentIndex');
    bad(Array.isArray(a.questionOrder) && a.questionOrder.length===30 &&
      new Set(a.questionOrder).size===30 && a.questionOrder.every(id=>ids.includes(id)),'questionOrder');
    bad(a.optionOrder && typeof a.optionOrder==='object' && Object.keys(a.optionOrder).length===30,'optionOrder');
    items.forEach(q=> {
      const order=a.optionOrder?.[q.id];
      bad(Array.isArray(order) && order.length===4 && [...order].sort().join('')==='ABCD',`optionOrder.${q.id}`);
    });
    bad(a.answers && typeof a.answers==='object' && !Array.isArray(a.answers),'answers');
    Object.entries(a.answers || {}).forEach(([id,selected])=>
      bad(items.find(q=>q.id===id)?.options.some(o=>o.id===selected),`answers.${id}`));
    bad(Array.isArray(a.flags) && new Set(a.flags).size===a.flags.length && a.flags.every(id=>ids.includes(id)),'flags');
    bad(Array.isArray(a.warningsShown) && a.warningsShown.every(v=>[600,300,60].includes(v)),'warningsShown');
    if (expectedStatus==='active') {
      bad(a.submittedAt===null && a.reason===null,'active.submittedAt/reason');
    } else {
      bad(Number.isFinite(a.submittedAt) && a.submittedAt>=a.startedAt && a.submittedAt<=deadline(a),'submittedAt');
      bad(['manual','timeout'].includes(a.reason),'reason');
    }
    return errors;
  }
  const unanswered = attempt => attempt.questionOrder.filter(id=>!attempt.answers[id]);
  const answeredCount = attempt => attempt.questionOrder.length-unanswered(attempt).length;
  L.engine={shuffled,start,setAnswer,move,toggleFlag,submit,remainingMs,deadline,isOpen,
    checkAttempt,unanswered,answeredCount};

<script>
/* Deterministic analysis; every revision message is read from resultConfig. */
(function(L) {
  'use strict';
  function mastery(percent) {
    const rule=L.data.resultConfig.globalRules.masteryThresholds
      .find(r=>percent>=r.minPercent && percent<=r.maxPercent);
    if (!rule) throw Error(`Ambang penguasaan tidak tersedia untuk ${percent}%.`);
    return {status:rule.status,label:rule.label};
  }
  function groupResult(items,attempt,group,index) {
    const correct=items.filter(q=>attempt.answers[q.id]===q.correctAnswer).length;
    const percentage=correct/items.length*100;
    const level=mastery(percentage);
    return {...group,index,total:items.length,correct,incorrect:items.length-correct,
      percentage,status:level.status,masteryLabel:level.label};
  }
  function selectWeak(groups, maximum) {
    const rules=L.data.resultConfig.globalRules.weakAreaSelection;
    const comparators={
      lowestAccuracy:(a,b)=>a.percentage-b.percentage,
      highestIncorrectCount:(a,b)=>b.incorrect-a.incorrect,
      largestItemCount:(a,b)=>b.total-a.total
    };
    return groups.filter(g=>!rules.includeOnlyIfNotPerfect || g.correct<g.total)
      .sort((a,b)=>{
        for (const key of rules.sortPriority) {
          const diff=comparators[key](a,b);
          if(diff!==0)return diff;
        }
        // Stable, source-config order after all three supplied criteria tie.
        return a.index-b.index;
      }).slice(0,Math.min(rules.maxAreas,maximum??rules.maxAreas));
  }
  function analyze(attempt) {
    if (!attempt || attempt.status!=='submitted') throw Error('Keputusan hanya tersedia selepas penghantaran.');
    const items=L.bank(attempt.simulation).items, cfg=L.config(attempt.simulation);
    const rules=L.data.resultConfig.globalRules;
    let correct=0, incorrect=0, unanswered=0, score=0;
    items.forEach(q=>{
      const selected=attempt.answers[q.id];
      if(selected===q.correctAnswer) { correct++; score+=rules.scoreTreatment.correct; }
      else if(selected) { incorrect++; score+=rules.scoreTreatment.incorrect; }
      else { unanswered++; score+=rules.scoreTreatment.unanswered; }
    });
    const view=cfg.masteryView, field=view.groupBy || view.primaryGroupBy;
    const groups=(view.groups || view.primaryGroups)
      .map((g,i)=>groupResult(items.filter(q=>q[field]===g.key),attempt,g,i));
    let focusGroups=groups, maximum=rules.weakAreaSelection.maxAreas;
    if(view.secondaryDiagnosis?.enabled) {
      const secondary=view.secondaryDiagnosis;
      maximum=secondary.maxAreas;
      focusGroups=Object.entries(secondary.grouping).flatMap(([topic,gs])=>
        gs.map(g=>({...g,topic}))).map((g,i)=>groupResult(items.filter(q=>
          q.topic===g.topic && Object.entries(g.match).every(([k,v])=>q[k]===v)),attempt,g,i));
    }
    const weak=selectWeak(focusGroups,maximum).map(g=>{
      const message=cfg.revisionMessages[g.key];
      return {...g,revisionTitle:typeof message==='string'?g.label:message.title,
        revisionMessage:typeof message==='string'?message:message.message};
    });
    return {
      simulation:attempt.simulation,title:cfg.title,total:items.length,score,
      percentage:score/items.length*100,
      timeUsedSeconds:Math.floor((attempt.submittedAt-attempt.startedAt)/1000),
      correct,incorrect,unanswered,groups,weak,
      perfectMessage:rules.weakAreaSelection.perfectMessage

  }

})(globalThis.EduLab = globalThis.EduLab || {});

<script>
/* Tab-session only. No localStorage, cookies, database, analytics or network writes. */
(function(L) {
  'use strict';
  const KEY='edup3133.hpk1.final.session.v1';
  const blank=()=>({version:1,fingerprint:L.fingerprint,active:null,results:{},lastResult:null});
  function validate(snapshot) {
    if(!snapshot || snapshot.version!==1 || snapshot.fingerprint!==L.fingerprint)
      throw Error('Sesi ini tidak sepadan dengan versi bank soalan. Gunakan RESET SESI.');
    if(snapshot.active) {
      const errors=L.engine.checkAttempt(snapshot.active,snapshot.active.simulation,'active');
      if(errors.length)throw Error(`Sesi aktif tidak sah: ${errors.join(', ')}. Gunakan RESET SESI.`);
    }
    if(!snapshot.results || typeof snapshot.results!=='object' || Array.isArray(snapshot.results))
      throw Error('Rekod sesi tidak sah. Gunakan RESET SESI.');
    for (const [sim,a] of Object.entries(snapshot.results)) {
      const errors=L.engine.checkAttempt(a,sim,'submitted');
      if(errors.length)throw Error(`Keputusan sesi tidak sah: ${errors.join(', ')}. Gunakan RESET SESI.`);
      L.deepFreeze(a);
    }
    if(snapshot.lastResult!==null && (!L.keys.includes(snapshot.lastResult) ||
      !snapshot.results[snapshot.lastResult])) throw Error('Rujukan keputusan sesi tidak sah. Gunakan RESET SESI.');
    return snapshot;
  }
  function create(backing) {
    return {
      read() {
        const probe=`${KEY}.probe`;
        backing.setItem(probe,'1');
        backing.removeItem(probe);
        const raw=backing.getItem(KEY);
        if(!raw)return blank();
        return validate(JSON.parse(raw));
      },
      write(snapshot) {
        backing.setItem(KEY,JSON.stringify(snapshot));
      },
      clear() {
        backing.removeItem(KEY);
        return blank();
      }
    };
  }
  L.storage={KEY,blank,validate,create};
})(globalThis.EduLab = globalThis.EduLab || {});

    <p>${kind==='data'?'Simulasi dinyahaktifkan sehingga fail sumber diperbetulkan. Tiada kandungan diubah secara automatik.':'Simpanan sesi pelayar diperlukan untuk mengekalkan pemasa selepas muat semula. Semak kebenaran storan pelayar atau reset rekod sesi yang tidak sah.'}</p>
    <details open><summary>Butiran teknikal</summary><pre>${e(errors.join('\n'))}</pre></details>
    ${kind==='session'?'<button class="primary-button" data-action="reset">RESET SESI</button>':''}
    </main>`;
  L.modalHTML=(title,body,confirmLabel='TERUSKAN',danger=false)=>`<div class="modal-head">
    <h2 id="modal-title">${e(title)}</h2><button class="icon-button" data-close aria-label="Tutup">${L.icon('close')}</button></div>
    <div class="modal-body">${body}</div><div class="modal-actions">
    <button class="secondary-button" data-close>KEMBALI</button>
    <button class="${danger?'danger-button':'primary-button'}" id="modal-confirm">${e(confirmLabel)} ${L.icon('arrow')}</button></div>`;
})(globalThis.EduLab = globalThis.EduLab || {});

</script>
<script>
(function(L) {
  'use strict';
  const e=L.escape;
  function simulationCard(sim,index) {
    const cfg=L.config(sim), theme=L.theme(sim), icon=sim==='topik1'?'pen':sim==='topik2'?'file':'trophy';
    return `<button class="simulation-card ${theme}" id="card-${sim}" data-action="start" data-sim="${sim}" aria-label="${e(cfg.title)} — MULA SIMULASI">
      <span class="card-top"><span class="icon-medallion">${L.icon(icon)}</span>
      ${sim==='final'?'<span class="gold-badge">JSU HPK1</span>':`<span class="card-number">0${index+1}</span>`}</span>
      <span class="card-name">${e(cfg.title)}</span>
      <span class="card-meta">${cfg.totalItems} ITEM <b>•</b> ${cfg.durationMinutes} MINIT</span>
      <span class="card-cta">MULA SIMULASI ${L.icon('arrow')}</span>
    </button>`;
  }
  const navItems=[
    {label:'SIMULASI TOPIK 1',theme:'pink',icon:'pen',action:'start',sim:'topik1'},
    {label:'SIMULASI TOPIK 2',theme:'sage',icon:'file',action:'start',sim:'topik2'},
    {label:'SIMULASI UJIAN SEBENAR',theme:'gold',icon:'trophy',action:'start',sim:'final'},
    {label:'KEPUTUSAN RINGKAS',theme:'lavender',icon:'chart',action:'results'},
    {label:'TOPIK 1',theme:'sky',icon:'book',action:'shortcut',target:'card-topik1'},
    {label:'TOPIK 2',theme:'pink',icon:'book',action:'shortcut',target:'card-topik2'},
    {label:'LATIHAN KENDIRI',theme:'sage',icon:'gear',action:'shortcut',target:'simulation-cards'},
    {label:'FOKUS UJIAN',theme:'peach',icon:'target',action:'shortcut',target:'card-final'}

  function quickNav() {

        <button class="quick-button ${n.theme}" data-action="${n.action}"

          <span class="nav-medallion">${L.icon(n.icon)}</span><span>${n.label}</span>
        </button>`).join('')}</nav>

            <div class="feature-banner">${L.icon('cap')}<div><h1 id="lab-title">HPK1 UJIAN MASTERY LAB</h1>
              <p>Kenal <b>•</b> Bezakan <b>•</b> Faham <b>•</b> Jawab</p></div></div>

<script>
(function(L) {
  'use strict';
  const e=L.escape;
  function navigator(attempt) {
    return `<nav class="question-navigator" aria-label="Navigator 30 soalan">${attempt.questionOrder.map((id,i)=>{
      const answered=Object.hasOwn(attempt.answers,id), flagged=attempt.flags.includes(id), current=attempt.currentIndex===i;
      return `<button type="button" class="question-cell ${answered?'answered':'unanswered'} ${flagged?'flagged':''} ${current?'current':''}"
        data-action="jump" data-index="${i}" ${current?'aria-current="step"':''}
        aria-label="Soalan ${i+1}, ${answered?'dijawab':'belum dijawab'}${flagged?', ditandai untuk semakan':''}">
        <span>${i+1}</span><small aria-hidden="true">${flagged?'⚑':answered?'✓':'—'}</small></button>`;
    }).join('')}</nav>`;
  }
  function render(attempt) {
    const cfg=L.config(attempt.simulation), idx=attempt.currentIndex, id=attempt.questionOrder[idx];
    const q=L.bank(attempt.simulation).items.find(q=>q.id===id);
    const answered=L.engine.answeredCount(attempt), flagged=attempt.flags.includes(id);
    const opts=attempt.optionOrder[id].map(id=>q.options.find(o=>o.id===id));
    // Deliberately no model/subtopic/construct/difficulty/answer/feedback in exam DOM.
    return `<main id="main-content" class="exam-screen ${L.theme(attempt.simulation)}" tabindex="-1">
      <div class="exam-statusbar">
        <div class="exam-title"><span class="eyebrow">SIMULASI KENDIRI</span><h1>${e(cfg.title)}</h1></div>
        <div class="timer-box">${L.icon('clock')}<div><span>BAKI MASA</span>
          <time id="countdown" role="timer" aria-live="off">${L.formatTime(Math.ceil(L.engine.remainingMs(attempt)/1000))}</time></div></div>
      </div>
      <div id="timer-warning" class="timer-warning" role="status" aria-live="polite"></div>
      <div class="exam-layout">
        <section class="question-panel panel" aria-labelledby="question-text">
          <div class="question-topline"><strong id="question-position">Soalan ${idx+1}/30</strong>
            <span class="answered-indicator">${answered}/30 dijawab</span></div>
          ${L.progressBar(answered,30,'Soalan dijawab')}
          <div class="question-heading"><span class="eyebrow">PILIH SATU JAWAPAN TERBAIK</span>
            <h2 id="question-text" tabindex="-1">${e(q.question)}</h2></div>
          <div class="answer-options" role="group" aria-labelledby="question-text">
            ${opts.map((o,i)=>`<button type="button" class="answer-option ${attempt.answers[id]===o.id?'selected':''}"
              data-action="answer" data-option="${e(o.id)}" data-question="${e(id)}"
              aria-pressed="${attempt.answers[id]===o.id}" aria-keyshortcuts="${'ABCD'[i]}">
              <span class="option-letter">${'ABCD'[i]}</span><span class="option-text">${e(o.text)}</span>
              <span class="selection-mark" aria-hidden="true">${attempt.answers[id]===o.id?'●':'○'}</span></button>`).join('')}
          </div>
          <div class="question-tools"><button class="flag-button ${flagged?'is-flagged':''}" data-action="flag"
            aria-pressed="${flagged}">${L.icon('flag')} ${flagged?'DITANDAI UNTUK SEMAKAN':'TANDA UNTUK SEMAKAN'}</button>
            <span class="keyboard-note">Papan kekunci: A–D</span></div>
          <div class="question-actions"><button class="secondary-button" data-action="previous" ${idx===0?'disabled':''}>${L.icon('back')} SEBELUMNYA</button>
            ${idx===29?`<button class="primary-button" data-action="submit">HANTAR SIMULASI ${L.icon('check')}</button>`:
              `<button class="primary-button" data-action="next">SETERUSNYA ${L.icon('arrow')}</button>`}
          </div>
        </section>
        <aside class="navigator-panel panel">
          <div class="navigator-title"><h2>Peta soalan</h2><span>1–30</span></div>
          ${navigator(attempt)}
          <div class="navigator-legend"><span><i class="answered">✓</i> Dijawab</span><span><i>—</i> Belum dijawab</span><span><i class="flagged">⚑</i> Ditandai</span></div>
          <div class="navigator-summary"><span><strong>${30-answered}</strong> belum dijawab</span><span><strong>${attempt.flags.length}</strong> ditandai</span></div>
          <button class="primary-button submit-button" data-action="submit">HANTAR SIMULASI ${L.icon('arrow')}</button>
          <p class="exam-note">${L.icon('lock')} Keputusan hanya dipaparkan selepas penghantaran.</p>
        </aside>
      </div>
    </main>`;
  }
  L.exam={render,navigator};
})(globalThis.EduLab = globalThis.EduLab || {});

</script>
<script>
(function(L) {
  'use strict';
  const e=L.escape;
  const tone={
    TOPIK_1:'pink',TOPIK_2:'sage',TPACK:'blue',SAMR:'orange',TIM:'green',
    '3E':'purple','3R':'teal',DIGITAL_BLOOM:'rainbow',
    TEKNOLOGI_PENDIDIKAN_PENGAJARAN:'pink',ISTE:'purple',INTEGRASI_BERMAKNA:'teal'
  };
  function masteryRow(g,showScore) {
    return `<div class="mastery-row ${tone[g.key]||'blue'}" data-group="${e(g.key)}">
      <div class="mastery-row-top"><div><h3>${e(g.label)}</h3>${L.statusPill(g.masteryLabel,g.status)}</div>
        <div class="mastery-number">${showScore?`<span>${g.correct}<small>/${g.total}</small></span>`:''}<strong>${L.percent(g.percentage)}%</strong></div></div>
      ${L.progressBar(g.percentage,100,`${g.label}: ${L.percent(g.percentage)}%`)}
    </div>`;
  }
  function render(attempt,available) {
    const r=L.diagnostics.analyze(attempt), cfg=L.config(attempt.simulation);
    const rc=L.data.resultConfig, display=rc.globalRules.resultDisplay, labels=rc.uiCopy.labels;
    // Group display labels and mastery labels are independent source fields.
    const groups=r.groups;
    const buttons=cfg.buttons.map((label,i)=>{
      let action='home',sim='';
      if(i===0) {action='start';sim=attempt.simulation;}
      else if(attempt.simulation==='final' && i===1) {action='start';sim='topik1';}
      else if(attempt.simulation==='final' && i===2) {action='start';sim='topik2';}
      return `<button class="${i===0?'primary-button':'secondary-button'}" data-action="${action}"
        ${sim?`data-sim="${sim}"`:''}>${e(label)} ${L.icon(action==='home'?'home':'arrow')}</button>`;
    }).join('');
    return `<main id="main-content" class="results-screen ${L.theme(attempt.simulation)}" tabindex="-1">
      <div class="results-heading"><div><p class="eyebrow">KEPUTUSAN RINGKAS</p><h1>${e(cfg.title)}</h1></div>
        <span class="submitted-pill">${L.icon('check')} SIMULASI DIHANTAR</span></div>
      <nav class="result-switcher" aria-label="Keputusan simulasi dalam sesi ini">${L.keys.filter(k=>available[k]).map(k=>`
        <button data-action="results" data-sim="${k}" ${k===attempt.simulation?'aria-current="page" class="active"':''}>
          ${e(L.config(k).title)}</button>`).join('')}</nav>
      ${attempt.reason==='timeout'?'<p class="auto-submit-notice" role="status">Masa tamat. Simulasi telah dihantar secara automatik pada 00:00.</p>':''}
      <section class="result-section overall-panel panel" aria-labelledby="overall-title">
        <div class="section-caption"><span class="section-number">01</span><h2 id="overall-title">${e(rc.globalRules.resultSections[0])}</h2></div>
        <div class="overall-stats">
          ${display.showScore?`<div class="stat stat-score"><span>${e(labels.score)}</span><strong>${r.score}<small>/${r.total}</small></strong></div>`:''}
          ${display.showPercentage?`<div class="stat"><span>${e(labels.percentage)}</span><strong>${L.percent(r.percentage)}<small>%</small></strong></div>`:''}
          ${display.showTimeUsed?`<div class="stat"><span>${e(labels.timeUsed)}</span><strong class="time-used">${L.formatTime(r.timeUsedSeconds)}</strong></div>`:''}
          ${display.showCorrectCount?`<div class="stat"><span>Betul</span><strong>${r.correct}</strong></div>`:''}
          ${display.showIncorrectCount?`<div class="stat"><span>Salah</span><strong>${r.incorrect}</strong></div>`:''}
          ${display.showUnansweredCount?`<div class="stat"><span>Tidak dijawab</span><strong>${r.unanswered}</strong></div>`:''}
        </div>
      </section>
      <div class="result-columns">
        <section class="result-section mastery-panel panel" aria-labelledby="mastery-title">
          <div class="section-caption"><span class="section-number">02</span><h2 id="mastery-title">${e(rc.globalRules.resultSections[1])}</h2></div>
          <div class="mastery-list">${groups.map(g=>masteryRow(g,attempt.simulation!=='topik1')).join('')}</div>
        </section>
        <section class="result-section focus-panel panel" aria-labelledby="focus-title">
          <div class="section-caption"><span class="section-number">03</span><h2 id="focus-title">${e(rc.globalRules.resultSections[2])}</h2></div>
          <div class="focus-list">${r.weak.length?r.weak.map((g,i)=>`<article class="focus-card" data-focus="${e(g.key)}">
            <span class="focus-index">${String(i+1).padStart(2,'0')}</span><div><h3>${e(g.revisionTitle)}</h3>
            <p class="revision-message">${e(g.revisionMessage)}</p></div></article>`).join(''):
              `<div class="perfect-message">${L.icon('trophy')}<p>${e(r.perfectMessage)}</p></div>`}</div>
        </section>
      </div>
      <div class="result-actions">${buttons}</div>
      <p class="result-note">${L.icon('shield')} ${e(rc.uiCopy.footerNote)}</p>
    </main>`;
  }
  L.results={render,masteryRow};
})(globalThis.EduLab = globalThis.EduLab || {});

</script>
<script>
(function(L) {
  'use strict';
  const mount=document.getElementById('app'), dialog=document.getElementById('app-dialog');
  const announcer=document.getElementById('announcer');
  let state=L.storage.blank(), store=null, validation=null, sessionError=null;
  let route={screen:'home',sim:null}, pending=null, previousFocus=null, rendering=false;
  const e=L.escape;
  function announce(text) {announcer.textContent=text;}
  function persist() {
    try {store.write(state);return true;}
    catch(err) {sessionError=`Simpanan sesi gagal: ${err.message}`;return false;}
  }
  function setHash(value) {
    try {history.replaceState(null,'',`#${value}`);}
    catch { /* file: browsers may restrict History API; state still controls the UI. */ }
  }
  function readRoute() {
    const path=location.hash.slice(1).split('/');
    if(path[0]==='keputusan')return {screen:'results',sim:L.keys.includes(path[1])?path[1]:state.lastResult};
    return {screen:'home',sim:null};
  }
  function render({focus=null,top=false}={}) {
    if(rendering)return;
    rendering=true;
    let html;
    if(!validation.valid)html=L.errorView(validation.errors,'data');
    else if(sessionError)html=L.errorView([sessionError],'session');
    else if(state.active) {
      route={screen:'exam',sim:state.active.simulation};
      setHash(`simulasi/${route.sim}`);
      html=L.exam.render(state.active);
    } else if(route.screen==='results') {
      const sim=route.sim || state.lastResult;
      html=state.results[sim]?L.results.render(state.results[sim],state.results):L.emptyResults();
      setHash(`keputusan${sim?'/'+sim:''}`);
    } else {html=L.home.render();setHash('home');}
    mount.innerHTML=L.header(!!state.active)+html+L.footer();
    if(top)window.scrollTo({top:0,behavior:'instant'});
    if(focus)document.querySelector(focus)?.focus({preventScroll:true});
    rendering=false;
    updateTimer();
  }
  function closeDialog(restore=true) {
    pending=null;
    if(dialog.open)dialog.close();
    if(restore && previousFocus?.isConnected)previousFocus.focus({preventScroll:true});
    previousFocus=null;
  }
  function showDialog(title,body,label,callback,danger=false) {
    if(dialog.open)closeDialog(false);
    previousFocus=document.activeElement;
    pending=callback;
    dialog.innerHTML=L.modalHTML(title,body,label,danger);
    dialog.showModal();
    // Safest initial target; no accidental submission from an existing Enter key.
    dialog.querySelector('[data-close]')?.focus();
  }
  function navigate(screen,sim=null) {
    if(state.active) {
      announce('Simulasi masih aktif. Keputusan dikunci sehingga penghantaran.');
      route={screen:'exam',sim:state.active.simulation};
      render({top:true,focus:'#question-text'});
      return;
    }
    route={screen,sim};
    render({top:true,focus:'#main-content'});
  }
  function startPrompt(sim) {
    if(!validation.valid || sessionError || !L.keys.includes(sim))return;
    if(state.active) {navigate('exam');return;}
    const cfg=L.config(sim);
    showDialog(cfg.title,`<div class="start-facts"><span>${L.icon('file')}<strong>${cfg.totalItems}</strong> ITEM</span>
      <span>${L.icon('clock')}<strong>${cfg.durationMinutes}</strong> MINIT</span></div>
      <p>Satu jawapan terbaik bagi setiap soalan. Soalan dan pilihan jawapan dirawakkan sekali pada permulaan.</p>
      <p>Anda boleh bergerak antara soalan dan menandai soalan untuk semakan. Keputusan hanya tersedia selepas penghantaran.</p>
      <div class="dialog-note">${L.icon('shield')}<span>Sesi sementara disimpan dalam tab ini. Muat semula halaman tidak menetapkan semula pemasa. Keputusan tidak dihantar kepada pensyarah.</span></div>
      <p class="start-reminder">Pemasa bermula apabila anda menekan <strong>MULA SIMULASI</strong>.</p>`,
      'MULA SIMULASI',()=>{
        if(state.active)return;
        state={...state,active:L.engine.start(sim,L.clock(),undefined,state.results[sim]?.questionOrder)};
        if(!persist()) {render();return;}
        render({top:true,focus:'#question-text'});
        announce(`${cfg.title} bermula. Baki masa 30 minit.`);
      });
  }
  function finish(reason='manual') {
    const a=state.active;
    if(!a || a.status!=='active')return false;
    const submitted=L.engine.submit(a,L.clock(),reason);
    state={...state,active:null,results:{...state.results,[a.simulation]:submitted},lastResult:a.simulation};
    closeDialog(false);
    persist();
    route={screen:'results',sim:a.simulation};
    render({top:true,focus:'#main-content'});
    announce(submitted.reason==='timeout'?'Masa tamat. Simulasi telah dihantar secara automatik.':'Simulasi telah dihantar.');
    return true;
  }
  function guard() {
    if(!state.active || sessionError || !validation.valid)return false;
    if(L.engine.remainingMs(state.active)<=0) {finish('timeout');return false;}
    return true;
  }
  function submitPrompt() {
    if(!guard())return;
    const missing=L.engine.unanswered(state.active), flagged=state.active.flags.length;
    const nums=missing.map(id=>state.active.questionOrder.indexOf(id)+1);
    showDialog('Hantar simulasi?',missing.length?
      `<p class="unanswered-warning"><strong>${missing.length} soalan belum dijawab.</strong></p>
      <p>Soalan: ${nums.join(', ')}.</p><p>Item yang tidak dijawab menerima sifar markah. Anda boleh kembali untuk melengkapkan jawapan.</p>
      ${flagged?`<p>${flagged} soalan masih ditandai untuk semakan.</p>`:''}
      <p>Jawapan tidak boleh diubah selepas penghantaran.</p>`:
      `<p>Semua 30 soalan telah dijawab.</p>${flagged?`<p>${flagged} soalan masih ditandai untuk semakan.</p>`:''}
      <p>Jawapan tidak boleh diubah selepas penghantaran.</p>`,
      'HANTAR SEKARANG',()=>finish('manual'));
  }
  function resetPrompt() {
    showDialog('Reset sesi ini?',`<p>Semua jawapan, penanda dan keputusan dalam sesi aplikasi ini akan dipadam.</p>
      ${state.active?'<p>Simulasi yang sedang berjalan juga akan ditamatkan tanpa keputusan.</p>':''}<p>Tindakan ini tidak boleh dibatalkan.</p>`,
      'RESET SESI',()=>{
        try {
          store=L.storage.create(globalThis.sessionStorage);
          store.clear();
          state=store.read();sessionError=null;route={screen:'home',sim:null};
        } catch(err) {sessionError=`Akses sessionStorage tidak tersedia: ${err.message}`;}
        render({top:true,focus:'#main-content'});
        announce(sessionError ? 'Sesi belum dapat direset. Semak akses storan pelayar.' : 'Sesi telah direset.');
      },true);
  }
  function updateTimer() {
    if(!state.active || sessionError || !validation?.valid)return;
    const ms=L.engine.remainingMs(state.active), remaining=Math.ceil(ms/1000);
    const el=document.getElementById('countdown');
    if(el && el.textContent!==L.formatTime(remaining))el.textContent=L.formatTime(remaining);
    document.querySelector('.timer-box')?.classList.toggle('urgent',remaining<=60);
    const warning=document.getElementById('timer-warning');
    const threshold=remaining<=60?60:remaining<=300?300:remaining<=600?600:null;
    const message=threshold ? `Baki masa ${threshold/60} minit atau kurang.` : '';
    if(warning && warning.textContent!==message)warning.textContent=message;
    if(threshold && !state.active.warningsShown.includes(threshold) && ms>0) {
      state={...state,active:{...state.active,warningsShown:[...state.active.warningsShown,threshold]}};
      if(!persist())render();
      announce(message);
    }
  }
  function tick() {
    if(!state.active)return;
    if(L.engine.remainingMs(state.active)<=0 && !sessionError)finish('timeout');
    else updateTimer();
  }
  mount.addEventListener('click',event=>{
    const btn=event.target.closest('[data-action]');
    if(!btn || btn.disabled)return;
    const action=btn.dataset.action, sim=btn.dataset.sim;
    if(action==='reset') {resetPrompt();return;}
    if(!validation.valid || sessionError)return;
    if(action==='home') {navigate('home');return;}
    if(action==='results') {navigate('results',sim);return;}
    if(action==='start') {startPrompt(sim);return;}
    if(action==='shortcut') {
      const target=document.getElementById(btn.dataset.target);
      target?.scrollIntoView({behavior:'smooth',block:'center'});
      target?.focus({preventScroll:true});
      return;
    }
    if(!guard())return;
    const a=state.active;
    if(action==='submit') {submitPrompt();return;}
    let next=a, focus=null, top=false;
    if(action==='answer') {next=L.engine.setAnswer(a,btn.dataset.question,btn.dataset.option);focus=`[data-option="${btn.dataset.option}"]`;}
    if(action==='flag') {next=L.engine.toggleFlag(a,a.questionOrder[a.currentIndex]);focus='[data-action="flag"]';}
    if(['next','previous','jump'].includes(action)) {
      const index=action==='jump'?Number(btn.dataset.index):a.currentIndex+(action==='next'?1:-1);
      next=L.engine.move(a,index);focus='#question-text';top=true;
    }
    state={...state,active:next};
    persist();
    render({focus,top});
  });
  dialog.addEventListener('click',event=>{
    if(event.target.closest('[data-close]'))closeDialog();
    else if(event.target.closest('#modal-confirm')) {
      const callback=pending;
      closeDialog(false);
      if(callback)callback();
    }
  });
  dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
  document.addEventListener('keydown',event=>{
    if(dialog.open || event.altKey || event.ctrlKey || event.metaKey || event.repeat ||
      /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName))return;
    const index='abcd'.indexOf(event.key.toLowerCase());
    if(index>=0 && event.key.length===1 && state.active) {
      event.preventDefault();
      if(guard())document.querySelectorAll('.answer-option')[index]?.click();
    }
  });
  window.addEventListener('hashchange',()=>{
    if(state.active){render();return;}
    route=readRoute();render({top:true,focus:'#main-content'});
  });
  window.addEventListener('focus',tick);
  window.addEventListener('pageshow',tick);
  document.addEventListener('visibilitychange',tick);
  validation=L.validateData(L.data);
  if(validation.valid) {
    try {store=L.storage.create(globalThis.sessionStorage);state=store.read();}
    catch(err) {sessionError=`Sesi tidak tersedia: ${err.message}`;}
  } else console.error('EDUP3133 validation failed:',validation.errors);
  route=readRoute();
  if(state.active && !sessionError && L.engine.remainingMs(state.active)<=0)finish('timeout');
  else render();
  window.setInterval(tick,250);
})(globalThis.EduLab = globalThis.EduLab || {});

</script>
</body>
